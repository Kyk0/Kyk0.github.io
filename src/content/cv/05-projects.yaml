entries:
- what: 'SONIC-K1: Motion Tracker for the Booster K1'
  when: Oct 2026
  note: NVIDIA SONIC, Isaac Lab, H100, MuJoCo, ONNX
  bullets:
  - 'First open-weights K1 tracker: SONIC/G1 port, trained from scratch on approximately 10,000 retargeted mocap clips in
    approximately 100 GPU-hours on one shared H100 (under 1% of SONIC compute).'
  - 'Unseen success in MuJoCo under the SONIC rule: 97.4% of 1,985 held-out clips; 93.6% external PHUMA; 99.0% 100STYLE. 95.9%
    under combined simulated hardware constraints; GPU-free laptop ONNX inference.'
  links:
