- what: LLM-Based Technical Assistant for Robotics Software Development
  when: In progress
  note: Bachelor’s thesis
  bullets:
  - Developing a locally hosted LLM-based assistant that combines robotics knowledge retrieval with context-aware generation
    to support implementation and troubleshooting. Planned evaluation targets technical accuracy and source traceability.
- what: Stylized and Teleoperable Locomotion for the Booster K1
  when: 2026 – present
  note: AMP, mjlab, PPO, MuJoCo, CAD
  bullets:
  - 'Trained and deployed multiple locomotion policies, including stylized catwalks, VR teleop and footwear balance, with
    SONIC fine-tuning. Simulated falls: under 2.5% in teleop and 3.9% in heels; designed and tested shoes, including heels
    and clogs.'
