title: Research experience
order: 2
entries:
- what: Undergraduate Robotics Researcher
  where: Advanced Telerobotics Research Lab, Kent State University (advisor Dr. Jong-Hoon Kim)
  place: Kent, OH, USA
  when: Mar 2026 – present
  note: Part-time, remote since Nov 2026.
  bullets:
  - Lead K1/G1 humanoid RL and motion tracking from simulation to hardware (SONIC, BeyondMimic, Kimodo); first author and
    co-author of robotics research papers.
  - Open-sourced a video-to-humanoid pipeline combining monocular motion recovery (GVHMR), GMR retargeting, reinforcement
    learning in Isaac Lab/BeyondMimic, and MuJoCo validation. Tested on the real K1 in consecutive hardware runs without falls,
    producing crossover steps narrower than the stock controller’s gait.
  - Co-authored a controlled Pepper LLM/HRI study of motivational interviewing and empathy (IHCI 2026, accepted).
  - Led a university-wide robot-learning workshop (13+ participants) and multiple ATR Lab workshops. Featured in a Vilnius
    University article; designed robot footwear, won a robot fashion hackathon award and represented the lab at Kent State
    Preview Day (Fox 8 coverage).
